<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 430" width="642" height="430" role="img" aria-labelledby="t d">
  <title id="t">BaoBlue</title>
  <desc id="d">Animación retro de una tienda de aros hechos a mano: un cursor recorre el catálogo, se completan los pasos explora, elige y hecho con amor, y se enciende el botón para hablar por WhatsApp.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    
    .cur{animation:shop 8s steps(1,end) infinite}
    .glow{animation:pulse 1.6s ease-in-out infinite}
    .ok{opacity:0;animation:8s steps(1,end) infinite}
    .k1{animation-name:k1}.k2{animation-name:k2}.k3{animation-name:k3}
    .btn{animation:btn 8s steps(1,end) infinite}
    .heart{opacity:0;animation:heart 8s ease-out infinite}
    .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.4s ease-in-out infinite}
    @keyframes shop{0%{transform:translate(0,0)}12.5%{transform:translate(94px,0)}25%{transform:translate(188px,0)}37.5%{transform:translate(282px,0)}50%{transform:translate(0,94px)}62.5%{transform:translate(94px,94px)}75%{transform:translate(188px,94px)}87.5%{transform:translate(282px,94px)}100%{transform:translate(282px,94px)}}
    @keyframes k1{0%{opacity:0}20%{opacity:1}97%{opacity:0}100%{opacity:0}}
    @keyframes k2{0%{opacity:0}50%{opacity:1}97%{opacity:0}100%{opacity:0}}
    @keyframes k3{0%{opacity:0}78%{opacity:1}97%{opacity:0}100%{opacity:0}}
    @keyframes btn{0%{opacity:.45}78%{opacity:1}97%{opacity:.45}100%{opacity:.45}}
    @keyframes heart{0%,78%{opacity:0;transform:translateY(0)}82%{opacity:1}96%,100%{opacity:0;transform:translateY(-40px)}}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
    @media (prefers-reduced-motion:reduce){.cur,.glow,.ok,.btn,.heart,.sway{animation:none}.ok{opacity:1}}
  </style>
