<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 430" width="642" height="430" role="img" aria-labelledby="t d">
  <title id="t">Asistente de Ley REP</title>
  <desc id="d">Animación retro de un chat de WhatsApp: el asistente responde una consulta sobre la Ley REP con un documento normativo y deriva una cotización al equipo comercial.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    
    .msg{animation:10s ease-out infinite}
    .m1{animation-name:m1}.m2{animation-name:m2}.m3{animation-name:m3}.m4{animation-name:m4}
    .ty{opacity:0;animation:10s linear infinite}
    .t1{animation-name:t1}.t2{animation-name:t2}
    .dot{animation:dot 1s steps(1,end) infinite}
    .d2{animation-delay:.2s}.d3{animation-delay:.4s}
    .blink{animation:blink 1s steps(1,end) infinite}
    .up{opacity:0;animation:up 10s ease-out infinite}
    @keyframes m1{0%,5%{opacity:0;transform:translateY(8px)}7%,96%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
    @keyframes t1{0%,13%{opacity:0}14%,26%{opacity:1}27%,100%{opacity:0}}
    @keyframes m2{0%,27%{opacity:0;transform:translateY(8px)}29%,96%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
    @keyframes m3{0%,45%{opacity:0;transform:translateY(8px)}47%,96%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
    @keyframes t2{0%,53%{opacity:0}54%,63%{opacity:1}64%,100%{opacity:0}}
    @keyframes m4{0%,64%{opacity:0;transform:translateY(8px)}66%,96%{opacity:1;transform:translateY(0)}97%,100%{opacity:0;transform:translateY(0)}}
    @keyframes up{0%,66%{opacity:0;transform:translateY(0)}70%{opacity:1}84%,100%{opacity:0;transform:translateY(-14px)}}
    @keyframes dot{0%{opacity:1}50%{opacity:.25}100%{opacity:.25}}
    @keyframes blink{0%{opacity:1}50%{opacity:.2}100%{opacity:.2}}
    @media (prefers-reduced-motion:reduce){.msg,.ty,.dot,.blink,.up{animation:none}}
  </style>
