  <title id="t">Financial Control Center</title>
  <desc id="d">Animación retro: del saldo líquido de 1.285.030 se descuentan 200.000 de ahorro y 50.000 comprometidos, y queda un disponible real de 1.035.030. Cifras de demostración.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
    
    .flow{animation:flow 2.4s linear infinite}
    .seg{opacity:.16;animation:seg 8s steps(1,end) both infinite}
    .glow{animation:pulse 2.2s ease-in-out infinite}
    .tw{animation:tw 2.6s ease-in-out infinite}
    .cover{animation:type 8s linear infinite}
    .lid{animation:lid 2.4s steps(1,end) infinite}
    @keyframes flow{0%{transform:translateX(0);opacity:0}10%,82%{opacity:1}100%{transform:translateX(176px);opacity:0}}
    @keyframes seg{0%{opacity:.16}6%{opacity:1}94%{opacity:.16}100%{opacity:.16}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
    @keyframes type{0%,4%{transform:translateX(0);animation-timing-function:steps(46,end)}44%,100%{transform:translateX(900px)}}
    @keyframes lid{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(-4px)}}
    @media (prefers-reduced-motion:reduce){.flow,.seg,.glow,.tw,.cover,.lid{animation:none}.seg{opacity:1}.cover,.flow{opacity:0}}
  </style>
